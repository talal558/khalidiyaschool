<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب جديد - مدرسة الخالدية الابتدائية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- خط عربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #020617;
            --accent: #38bdf8;
            --accent-soft: rgba(56, 189, 248, 0.12);
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --border-soft: rgba(148, 163, 184, 0.35);
            --btn-primary: #22c55e;
            --btn-primary-dark: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Tajawal", system-ui, -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #1f2937 0, #020617 50%, #020617 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== الشريط العلوي ===== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(15, 23, 42, 0.96);
            -webkit-backdrop-filter: blur(18px); /* دعم Safari */
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.25);
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0.6rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.55rem;
        }

        .brand-icon {
            width: 2.4rem;
            height: 2.4rem;
            border-radius: 999px;
            border: 1px solid rgba(56, 189, 248, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow:
                0 0 25px rgba(56, 189, 248, 0.4),
                0 0 0 1px rgba(15, 23, 42, 0.9);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 1.1rem;
            letter-spacing: 0.06em;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .main-nav {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link {
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            font-size: 0.85rem;
            color: #e5e7eb;
            text-decoration: none;
            border: 1px solid transparent;
            background: transparent;
            transition: all 0.18s ease-out;
        }

        .nav-link:hover {
            border-color: rgba(148, 163, 184, 0.6);
            background: rgba(15, 23, 42, 0.9);
        }

        @media (max-width: 768px) {
            .header-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .main-nav {
                width: 100%;
                flex-wrap: wrap;
            }
        }

        /* ===== صفحة التسجيل ===== */
        main.auth-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem 3rem;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            background: radial-gradient(circle at top, #020617, #020617 90%);
            border-radius: 1.8rem;
            border: 1px solid var(--border-soft);
            box-shadow: 0 25px 70px rgba(15, 23, 42, 0.95);
            padding: 2.2rem 2.3rem 1.8rem;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(56, 189, 248, 0.25), transparent 55%),
                radial-gradient(circle at bottom, rgba(34, 197, 94, 0.18), transparent 55%);
            pointer-events: none;
        }

        .auth-inner {
            position: relative;
            z-index: 1;
        }

        .auth-title {
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.4rem;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.4rem;
        }

        .auth-form-group {
            margin-bottom: 0.9rem;
        }

        .auth-label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
        }

        .auth-input {
            width: 100%;
            border-radius: 0.9rem;
            border: 1px solid rgba(15, 23, 42, 0.9);
            background: rgba(15, 23, 42, 0.96);
            padding: 0.55rem 0.8rem;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .auth-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4);
            background: #020617;
        }

        .auth-actions {
            margin-top: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .btn-primary {
            width: 100%;
            border: none;
            border-radius: 999px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(90deg, var(--btn-primary), var(--btn-primary-dark));
            color: white;
            box-shadow: 0 15px 35px rgba(22, 163, 74, 0.7);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
            box-shadow: 0 18px 40px rgba(22, 163, 74, 0.9);
        }

        .btn-secondary {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            border-radius: 999px;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid rgba(148, 163, 184, 0.7);
            background: rgba(15, 23, 42, 0.96);
            color: #e5e7eb;
            text-decoration: none;
            transition: all 0.18s ease-out;
        }

        .btn-secondary:hover {
            background: rgba(15, 23, 42, 0.9);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }

        .auth-footer-text {
            margin-top: 1.1rem;
            font-size: 0.78rem;
            text-align: center;
            color: var(--text-muted);
        }

        .auth-footer-text strong {
            color: #e5e7eb;
        }

        /* رسالة الخطأ بدون inline style */
        .form-error {
            color: #fca5a5;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        /* ===== الفوتر ===== */
        .site-footer {
            margin-top: 1.5rem;
            border-top: 1px solid rgba(148, 163, 184, 0.25);
            background: radial-gradient(circle at top, #020617 0, #020617 40%, #020617 100%);
        }

        .footer-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0.75rem 1.5rem 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }

        .footer-main,
        .footer-meta {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .footer-separator {
            opacity: 0.5;
        }

        .footer-main strong,
        .footer-meta strong {
            color: #e5e7eb;
        }

        @media (max-width: 768px) {
            .footer-inner {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

{% include "header.html" %}

<main class="auth-page">
    <section class="auth-card">
        <div class="auth-inner">

            <h1 class="auth-title">إنشاء حساب جديد</h1>
            <p class="auth-subtitle">تعبئة بيانات المستخدم لإعطائه صلاحية الدخول للنظام.</p>

            <form method="post" action="{% url 'schoolaccounts:signup' %}">
                {% csrf_token %}
                {% if error %}
                    <p class="form-error">{{ error }}</p>
                {% endif %}

                <div class="auth-form-group">
                    <label class="auth-label" for="id_username">اسم المستخدم</label>
                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        class="auth-input"
                        required
                    >
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="id_email">البريد الإلكتروني (اختياري)</label>
                    <input
                        type="email"
                        name="email"
                        id="id_email"
                        class="auth-input"
                    >
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="id_password1">كلمة المرور</label>
                    <input
                        type="password"
                        name="password1"
                        id="id_password1"
                        class="auth-input"
                        required
                    >
                </div>

                <div class="auth-form-group">
                    <label class="auth-label" for="id_password2">تأكيد كلمة المرور</label>
                    <input
                        type="password"
                        name="password2"
                        id="id_password2"
                        class="auth-input"
                        required
                    >
                </div>

                <div class="auth-actions">
                    <button type="submit" class="btn-primary">
                        إنشاء الحساب
                    </button>

                    <a href="{% url 'schoolaccounts:login' %}" class="btn-secondary">
                        لدي حساب بالفعل – تسجيل الدخول
                    </a>
                </div>
            </form>

            <p class="auth-footer-text">
                khalidiyaschool • <strong>لوحة توقيت مدرسية</strong>
            </p>
        </div>
    </section>
</main>

{% include "footer.html" %}

</body>
</html>
