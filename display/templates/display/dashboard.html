<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة التوقيت - مدرسة الخالدية الابتدائية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #f9fafb;
            direction: rtl;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        header h1 {
            font-size: 1.8rem;
            margin: 0;
        }

        header p {
            margin: 0.25rem 0;
            color: #9ca3af;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: #020617;
            border-radius: 1rem;
            padding: 1rem 1.25rem;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.15);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 0.75rem;
        }

        .time-now {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 0.08em;
        }

        .time-date {
            color: #9ca3af;
            margin-bottom: 0.5rem;
        }

        .current-period {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, #22c55e22, #22c55e11);
            border: 1px solid #22c55e55;
        }

        .current-period-title {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .current-period-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .countdown {
            margin-top: 0.5rem;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .next-period {
            margin-top: 0.75rem;
            font-size: 0.95rem;
            color: #e5e7eb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            padding: 0.6rem 0.4rem;
            text-align: center;
        }

        th {
            border-bottom: 1px solid rgba(148, 163, 184, 0.4);
            color: #e5e7eb;
            font-weight: 600;
        }

        tbody tr {
            border-bottom: 1px dashed rgba(31, 41, 55, 0.9);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        .tag {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
        }

        .tag-class {
            background: rgba(59, 130, 246, 0.16);
            border: 1px solid rgba(59, 130, 246, 0.7);
            color: #bfdbfe;
        }

        .tag-break {
            background: rgba(234, 179, 8, 0.16);
            border: 1px solid rgba(234, 179, 8, 0.9);
            color: #facc15;
        }

        .tag-start {
            background: rgba(16, 185, 129, 0.16);
            border: 1px solid rgba(16, 185, 129, 0.7);
            color: #6ee7b7;
        }

        .tag-end {
            background: rgba(239, 68, 68, 0.16);
            border: 1px solid rgba(239, 68, 68, 0.7);
            color: #fecaca;
        }

        .row-current {
            background: rgba(34, 197, 94, 0.12);
        }

        .row-finished {
            opacity: 0.5;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            display: inline-block;
        }

        .status-running {
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        .status-upcoming {
            background: #3b82f6;
        }

        .status-done {
            background: #6b7280;
        }

        .alert-flash {
            animation: flash 0.6s ease-in-out 3;
        }

        @keyframes flash {
            0%, 100% { background-color: #0f172a; }
            50% { background-color: #1e293b; }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background: rgba(148, 163, 184, 0.12);
            border-radius: 999px;
            padding: 0.2rem 0.7rem;
            font-size: 0.75rem;
            color: #e5e7eb;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .small {
            font-size: 0.8rem;
        }

        .error {
            color: #fecaca;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
<div class="container" id="page">
    <header>
        <h1>نظام إدارة التوقيت المدرسي</h1>
        <p>مدرسة الخالدية الابتدائية</p>
    </header>

    <div class="grid">
        <!-- بطاقة الوقت والعد التنازلي -->
        <section class="card">
            <h2>الوقت الحالي</h2>
            <div class="time-now" id="timeNow">--:--:--</div>
            <div class="time-date" id="dateNow">--/--/----</div>

            <div id="currentPeriodBox" class="current-period" style="display:none;">
                <div class="current-period-title">
                    الفترة الحالية:
                </div>
                <div class="current-period-name" id="currentPeriodName">-</div>
                <div class="countdown" id="countdown">--:--:--</div>
                <div class="next-period" id="nextPeriodBox"></div>
            </div>

            <div id="noPeriodMsg" class="small" style="margin-top:1rem;">
                لا توجد فترة حالية في هذا الوقت.
            </div>

            <div style="margin-top:1rem;">
                <span class="badge">
                    <span class="badge-dot"></span>
                    محدث آليًا كل ثانية
                </span>
            </div>

            <div class="error" id="errorBox" style="display:none;"></div>

            <!-- صوت تنبيه -->
            <audio id="bell" preload="auto">
                <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
            </audio>
        </section>

        <!-- بطاقة جدول اليوم -->
        <section class="card">
            <h2>جدول اليوم</h2>
            <div class="small" id="scheduleMeta"></div>
            <div style="overflow-x:auto; margin-top:0.75rem;">
                <table>
                    <thead>
                    <tr>
                        <th>الحالة</th>
                        <th>الفترة</th>
                        <th>النوع</th>
                        <th>من</th>
                        <th>إلى</th>
                    </tr>
                    </thead>
                    <tbody id="periodsTableBody">
                    <tr>
                        <td colspan="5" class="small">جاري تحميل الجدول...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>

<script>
(function () {
    let periods = [];
    let currentIndex = null;
    let lastPeriodIndex = null;
    let scheduleLoaded = false;

    function pad(num) {
        return num.toString().padStart(2, "0");
    }

    function formatTime(date) {
        return pad(date.getHours()) + ":" + pad(date.getMinutes());
    }

    function formatDate(date) {
        const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
        return days[date.getDay()] + " - " + date.getDate() + " " + months[date.getMonth()] + " " + date.getFullYear();
    }

    function typeLabel(t) {
        switch (t) {
            case "start": return "بداية الدوام";
            case "class": return "حصة";
            case "break": return "فسحة / استراحة";
            case "end":   return "نهاية الدوام";
            default:      return t;
        }
    }

    function typeTagClass(t) {
        switch (t) {
            case "start": return "tag tag-start";
            case "class": return "tag tag-class";
            case "break": return "tag tag-break";
            case "end":   return "tag tag-end";
            default:      return "tag";
        }
    }

    function renderTable(now) {
        const tbody = document.getElementById("periodsTableBody");
        tbody.innerHTML = "";

        if (!periods.length) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 5;
            td.className = "small";
            td.textContent = "لا يوجد جدول مسجّل لهذا اليوم.";
            tr.appendChild(td);
            tbody.appendChild(tr);
            return;
        }

        periods.forEach((p, idx) => {
            const start = new Date(p.start);
            const end = new Date(p.end);
            let rowClass = "";
            let statusClass = "";
            let statusTitle = "";

            if (now > end) {
                rowClass = "row-finished";
                statusClass = "status-dot status-done";
                statusTitle = "انتهت";
            } else if (now >= start && now <= end) {
                rowClass = "row-current";
                statusClass = "status-dot status-running";
                statusTitle = "جارية الآن";
            } else {
                statusClass = "status-dot status-upcoming";
                statusTitle = "قادمة";
            }

            const tr = document.createElement("tr");
            if (rowClass) tr.className = rowClass;

            const tdStatus = document.createElement("td");
            const dot = document.createElement("span");
            dot.className = statusClass;
            dot.title = statusTitle;
            tdStatus.appendChild(dot);

            const tdName = document.createElement("td");
            tdName.textContent = p.name;

            const tdType = document.createElement("td");
            const spanType = document.createElement("span");
            spanType.className = typeTagClass(p.type);
            spanType.textContent = typeLabel(p.type);
            tdType.appendChild(spanType);

            const tdStart = document.createElement("td");
            tdStart.textContent = formatTime(start);

            const tdEnd = document.createElement("td");
            tdEnd.textContent = formatTime(end);

            tr.appendChild(tdStatus);
            tr.appendChild(tdName);
            tr.appendChild(tdType);
            tr.appendChild(tdStart);
            tr.appendChild(tdEnd);

            tbody.appendChild(tr);
        });
    }

    function updateClockAndState() {
        const now = new Date();
        document.getElementById("timeNow").textContent = formatTime(now);
        document.getElementById("dateNow").textContent = formatDate(now);

        if (!scheduleLoaded || !periods.length) return;

        let current = null;
        let currentIdx = null;

        periods.forEach((p, idx) => {
            const start = new Date(p.start);
            const end = new Date(p.end);
            if (now >= start && now <= end) {
                current = p;
                currentIdx = idx;
            }
        });

        currentIndex = currentIdx;

        const currentBox = document.getElementById("currentPeriodBox");
        const noMsg = document.getElementById("noPeriodMsg");
        const countdownEl = document.getElementById("countdown");
        const currentNameEl = document.getElementById("currentPeriodName");
        const nextBox = document.getElementById("nextPeriodBox");

        if (!current) {
            currentBox.style.display = "none";
            noMsg.style.display = "block";
            return;
        }

        currentBox.style.display = "block";
        noMsg.style.display = "none";

        currentNameEl.textContent = current.name + " (" + typeLabel(current.type) + ")";

        // حساب الوقت المتبقي
        const end = new Date(current.end);
        let diffMs = end - now;
        if (diffMs < 0) diffMs = 0;
        const diffSec = Math.floor(diffMs / 1000);
        const h = Math.floor(diffSec / 3600);
        const m = Math.floor((diffSec % 3600) / 60);
        const s = diffSec % 60;
        countdownEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;

        // الفترة القادمة
        const next = periods[currentIdx + 1];
        if (next) {
            const ns = new Date(next.start);
            nextBox.textContent = `الفترة القادمة: ${next.name} (${typeLabel(next.type)}) – ${formatTime(ns)}`;
        } else {
            nextBox.textContent = "لا توجد فترة أخرى بعد هذه الفترة.";
        }

        // إعادة رسم الجدول لتحديث الحالات
        renderTable(now);

        // لو تغيرت الفترة الحالية عن السابق -> نفّذ تنبيه
        if (lastPeriodIndex !== null && currentIdx !== null && currentIdx !== lastPeriodIndex) {
            triggerAlert();
        }
        lastPeriodIndex = currentIdx;
    }

    function triggerAlert() {
        const audio = document.getElementById("bell");
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }

        const page = document.getElementById("page");
        page.classList.remove("alert-flash");
        void page.offsetWidth;
        page.classList.add("alert-flash");
    }

    async function loadSchedule() {
        const errorBox = document.getElementById("errorBox");
        errorBox.style.display = "none";

        try {
            const res = await fetch("/timetable/api/today-schedule/");
            if (!res.ok) {
                throw new Error("فشل تحميل الجدول.");
            }
            const data = await res.json();
            if (!data.success) {
                throw new Error(data.message || "لا يوجد جدول لهذا اليوم.");
            }

            periods = data.periods || [];
            scheduleLoaded = true;

            const meta = document.getElementById("scheduleMeta");
            meta.textContent = `تاريخ اليوم: ${data.date} – جدول: ${data.schedule_name}`;

            renderTable(new Date(data.now));
            updateClockAndState();
        } catch (err) {
            errorBox.textContent = err.message;
            errorBox.style.display = "block";
            scheduleLoaded = false;
        }
    }

    loadSchedule();
    setInterval(updateClockAndState, 1000);
    setInterval(loadSchedule, 5 * 60 * 1000);
})();
</script>
</body>
</html>
