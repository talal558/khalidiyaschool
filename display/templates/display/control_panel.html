<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - مدرسة الخالدية الابتدائية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- خط عربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #020617;
            --text-main: #e5e7eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Tajawal", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
        }

        .control-panel-main {
            max-width: 1280px;
            margin: 0 auto 2rem;
            padding: 2rem 1.5rem;
        }

        .control-panel-card {
            border-radius: 1.4rem;
            padding: 1.5rem 1.8rem;
            background: radial-gradient(circle at top, #020617 0, #020617 50%, #020617 100%);
            box-shadow:
                0 24px 60px rgba(15, 23, 42, 0.9),
                0 0 0 1px rgba(148, 163, 184, 0.18);
        }

        .control-panel-card h1 {
            margin: 0 0 0.6rem;
            font-size: 1.3rem;
        }

        .control-panel-card p {
            margin: 0.2rem 0;
            color: #9ca3af;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

{% include "header.html" %}

<main class="control-panel-main">
    <section class="control-panel-card">
        <h1>لوحة التحكم</h1>
        <p>هذه صفحة مبدئية للوحة التحكم. يمكنك تطويرها لاحقًا.</p>
    </section>
</main>

{% include "footer.html" %}

</body>
</html>
